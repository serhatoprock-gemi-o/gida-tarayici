<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gıda Tarayıcı: Prototip</title>
<style>
:root{--page:#E9EEEA;--bg:#FFFFFF;--surface:#F3F7F4;--text:#14201A;--muted:#55655D;--accent:#1E7A4C;--border:#DCE5DF;--cam:#15201B;--safe:#1B8A4F;--caution:#E88A1A;--neutral:#55655D;--chipBg:#E6F4EC;--chipCaut:#FDF0E0;--sA:#1B8A4F;--sB:#7CC242;--sC:#F2C12E;--sD:#E88A1A;--sE:#D6392F}
[data-theme=dark]{--page:#060908;--bg:#0E1512;--surface:#17221D;--text:#E8F3EC;--muted:#A4B8AC;--accent:#3DD68C;--border:#263630;--cam:#070B09;--safe:#4FD08A;--caution:#F5A449;--neutral:#A4B8AC;--chipBg:#12261C;--chipCaut:#2A2014;--sA:#4FD08A;--sB:#9BD86A;--sC:#F4D35E;--sD:#F5A449;--sE:#FF6B61}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--page);font-family:Inter,system-ui,sans-serif}
.phone{width:390px;height:844px;background:var(--bg);color:var(--text);border-radius:36px;border:1px solid var(--border);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 8px 30px #0000001F}
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.tabbar{height:72px;flex-shrink:0;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;background:var(--bg)}
.tab{background:none;border:0;color:var(--muted);font:600 13px Inter;min-height:44px;padding:0 10px;cursor:pointer}
.tab.on{color:var(--accent);font-weight:700}
.btn{min-height:52px;border-radius:14px;font:600 15px Inter;padding:0 16px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.btn.p{background:var(--accent);color:#FFFFFF}
.btn:disabled{opacity:.6;cursor:default}
.pair{display:flex;gap:12px}
.pair .btn{flex:1}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:0;border-radius:20px;padding:12px 14px;width:100%;min-height:52px;text-align:left;color:var(--text);font:inherit;cursor:pointer}
.badge{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 18px Inter;color:#14201A;flex-shrink:0}
.bar{height:8px;border-radius:4px;background:var(--border);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%}
.chip{font:600 12px Inter;padding:6px 12px;border-radius:999px;border:1px solid;color:var(--text);display:inline-block}
.cam{background:var(--cam);height:300px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;color:#FFFFFF}
.frame{width:260px;height:150px;border:2px solid #FFFFFF;border-radius:16px}
.pad{padding:20px;display:flex;flex-direction:column;gap:14px}
h2{margin:0;font:700 24px Inter}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border-radius:20px;padding:16px}
.toast{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font:600 13px Inter;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="phone" id="phone" data-theme="light">
  <div class="screen" id="app"></div>
  <nav class="tabbar" id="tabs"></nav>
  <div class="toast" id="toast"></div>
</div>

const ADDU = Object.fromEntries(Object.keys(ADD).map(k=>[k.toUpperCase(),k]));
const dispCode = c => ADDU[String(c).toUpperCase()] || c;
const info = c => ADD[ADDU[String(c).toUpperCase()]] || {n:"Bilinmeyen katkı", r:"neutral"};
const S = {screen:"tara", cur:null, hist:[], dark:false, busy:false};
const $ = id => document.getElementById(id);
const grade = s => s>=80?"A":s>=60?"B":s>=40?"C":s>=20?"D":"E";
const gcol = s => `var(--s${grade(s)})`;
const ccol = r => ({caution:"var(--caution)", safe:"var(--safe)", neutral:"var(--neutral)"})[r];
const num = v => v.toFixed(1).replace(".", ",");

function nut(label, v, max, lim){
  const c = v > lim ? "var(--caution)" : "var(--safe)";
  const w = Math.min(v / max * 100, 100);
  return `<div><div style="display:flex;justify-content:space-between;font-size:15px"><span>${label}</span><span style="font-weight:600">${num(v)} g</span></div><div class="bar"><i style="width:${w}%;background:${c}"></i></div></div>`;
}
function chips(list){
  return list.map(c => {
    const a = info(c), r = a.r;
    return `<button class="chip" onclick="openAdd('${c}')" style="background:${r==='caution'?'var(--chipCaut)':'var(--chipBg)'};border-color:${ccol(r)};cursor:pointer;min-height:32px">${dispCode(c)} · ${a.n}</button>`;
  }).join("");
}
function addHist(p){ S.hist = [p, ...S.hist.filter(x => x.name !== p.name)].slice(0, 20); }
function histRow(h, i){
  return `<button class="row" onclick="openHist(${i})"><div class="badge" style="background:${gcol(h.score)}">${grade(h.score)}</div><div style="flex:1;min-width:0"><div style="font-weight:600">${h.name}</div><div class="muted">${h.score}/100</div></div></button>`;
}

function tara(){
  return `<div class="cam"><video id="vid" playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video><div class="frame" style="position:relative"></div>
    <div style="position:absolute;top:20px;left:20px;right:20px;font:700 17px Inter">Gıda Tarayıcı</div>
    <div id="cmsg" style="position:absolute;bottom:14px;left:0;right:0;text-align:center;padding:0 16px;font-size:15px;color:#E8F3EC;text-shadow:0 1px 3px #000">Barkodu çerçevenin içine getirin</div></div>
  <div class="pad">
    <div class="muted">Kamera açılınca barkodu okutun. Deneme için örnek barkodlar:</div>
    <button class="btn" onclick="startCam()">Kamerayı yeniden aç</button>
    <button class="btn p" onclick="scan('8690000000001')">Kepekli Bisküvi barkodunu okut</button>
    <button class="btn" onclick="scan('8690000000002')">Yulaf Ezmesi barkodunu okut</button>
    <button class="btn" onclick="scan('8691111111111')">Bilinmeyen barkod okut</button>
    <div style="font:700 17px Inter;margin-top:6px">Son taramalar</div>
    ${S.hist.length ? S.hist.slice(0,3).map(histRow).join("") : '<div class="muted">Henüz tarama yok.</div>'}
  </div>`;
}

function sonuc(){
  const p = S.cur;
  if(!p) return tara();
  return `<div class="pad" style="padding-top:12px">
    <button onclick="go('tara')" style="background:none;border:0;text-align:left;font:600 14px Inter;color:var(--accent);padding:0;min-height:44px;cursor:pointer">← Yeni tara</button>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px">
      <div style="min-width:0"><h2>${p.name}</h2><div class="muted">${p.brand} · ${p.qty}</div></div>
      <div class="badge" style="width:72px;height:72px;flex-direction:column;line-height:1;font-size:30px;background:${gcol(p.score)}">${grade(p.score)}<span style="font-size:12px;font-weight:600;margin-top:2px">${p.score}/100</span></div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="muted" style="font-weight:600">100 g başına</div>
      ${nut("Şeker", p.sugar, 22.5, 5)}
      ${nut("Doymuş yağ", p.satFat, 5, 3)}
      ${nut("Tuz", p.salt, 1.5, 1)}
    </div>
    <div>
      <div class="muted" style="font-weight:600;margin-bottom:8px">Katkı maddeleri</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${p.add.length ? chips(p.add) : '<span class="muted">Katkı maddesi bulunmadı</span>'}</div>
    </div>
    <div class="pair" style="margin-top:8px">
      <button class="btn" onclick="editP()">Düzenle</button>
      <button class="btn p" onclick="go('tara')">Yeni tara</button>
    </div>
  </div>`;
}

function bulunamadi(){

}


function gecmis(){
  return `<div class="pad"><h2>Geçmiş</h2>

}

function ayarlar(){
  return `<div class="pad"><h2>Ayarlar</h2>

const RTXT = {caution:"Dikkat", safe:"Bildirilmiş sorun yok", neutral:"Nötr / sınırlı veri"};
const YN = {y:"Evet", n:"Hayır", m:"Belirsiz"};
function openAdd(c){ S.addCode = dispCode(c); S.back = S.screen === "katki" ? S.back : S.screen; go("katki"); }
function addRow(k){
  const a = ADD[k];
  return `<button class="row" onclick="openAdd('${k}')"><div class="badge" style="width:auto;min-width:56px;padding:0 6px;border-radius:14px;font-size:12px;background:${ccol(a.r)}">${k}</div><div style="flex:1;min-width:0"><div style="font-weight:600">${a.n}</div><div class="muted">${(a.c||[]).join(" · ") || RTXT[a.r]}</div></div></button>`;
}
function fillList(){
  const q = fold(S.q||"").trim();
  const m = IDX.filter(x => !q || x.t.includes(q));
  $("qn").textContent = m.length + " katkı maddesi";
  $("klist").innerHTML = m.slice(0,40).map(x => addRow(x.k)).join("") + (m.length>40 ? '<div class="muted">İlk 40 sonuç gösteriliyor. Aramayı daraltın.</div>' : "");
}
function katkilar(){
  return `<div class="pad"><h2>Katkı maddeleri</h2>
    <input id="q" value="${(S.q||"").replace(/"/g,"&quot;")}" oninput="S.q=this.value;fillList()" placeholder="Ara: E102, tartrazin, koruyucu" style="min-height:48px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:0 14px;font:15px Inter;width:100%">
    <div class="muted" id="qn"></div>
    <div id="klist" style="display:flex;flex-direction:column;gap:8px"></div></div>`;
}
function katki(){
  const c = S.addCode, a = info(c), r = a.r;
  const flags = (a.w||[]).map(x => `<div style="font-size:14px;line-height:1.45">• ${x}</div>`).join("");
  return `<div class="pad" style="padding-top:12px">
    <button onclick="go(S.back||'katkilar')" style="background:none;border:0;text-align:left;font:600 14px Inter;color:var(--accent);padding:0;min-height:44px;cursor:pointer">← Geri</button>
    <div style="display:flex;align-items:center;gap:14px">
      <div class="badge" style="width:auto;min-width:64px;height:56px;padding:0 8px;border-radius:16px;font-size:14px;background:${ccol(r)}">${dispCode(c)}</div>
      <div style="min-width:0"><h2 style="font-size:20px">${a.n}</h2><div class="muted">${(a.c||[]).join(" · ") || "Sınıf bilgisi yok"}</div></div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px">
      <span class="chip" style="align-self:flex-start;border-color:${ccol(r)};background:${r==='caution'?'var(--chipCaut)':'var(--chipBg)'}">${RTXT[r]}</span>
      ${flags || '<div class="muted">Bu katkı için işaretlenmiş bir uyarı yok.</div>'}
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px;font-size:15px">
      <div style="display:flex;justify-content:space-between"><span>Vegan</span><b>${YN[a.v]||"Bilgi yok"}</b></div>
      <div style="display:flex;justify-content:space-between"><span>Vejetaryen</span><b>${YN[a.t]||"Bilgi yok"}</b></div>
      <div style="display:flex;justify-content:space-between"><span>Palmiye yağı kaynaklı olabilir</span><b>${YN[a.p]||"Bilgi yok"}</b></div>
    </div>
    <div class="muted">Kaynak: Open Food Facts katkı maddesi sınıflandırması. Bilgilendirme amaçlıdır, tıbbi tavsiye değildir.</div>
  </div>`;
}

const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
let NAMES_ = null;
function namesList(){
  return NAMES_ || (NAMES_ = Object.keys(ADD).map(k => ({k, n: fold(ADD[k].n)})).filter(x => x.n.length >= 7 && /^[a-z ]+$/.test(x.n)).map(x => ({k:x.k, re:new RegExp("\\b"+esc(x.n)+"\\b")})));
}
function cleanOcr(t){
  return fold(t).replace(/(\d)o(?=[,.\d])/g,(m,a)=>a+"0").replace(/\bo(?=[,.]\d)/g,"0").replace(/([,.])o(?=\s|g|$)/g,(m,a)=>a+"0").replace(/(\d)\s*[,.]\s*(\d)/g,"$1.$2");
}
function parseLabel(raw){
  const t = cleanOcr(raw);
  const i = t.indexOf("icindekiler");
  let ing = i >= 0 ? t.slice(i+11) : "";
  ing = ing.split(/besin (?:degeri|ogeleri)|alerjen|uretici|saklama|son tuketim/)[0];
  const nut = i >= 0 ? t.replace(ing, "") : t;
  const pick = re => { const m = nut.match(re); return m ? parseFloat(m[1]) : null; };
  const sugar = pick(/seker\w*\D{0,14}?(\d+(?:\.\d+)?)\s*g/);
  const satFat = pick(/doymus\s*yag\w*\D{0,14}?(\d+(?:\.\d+)?)\s*g/);
  let salt = pick(/\btuz\D{0,14}?(\d+(?:\.\d+)?)\s*g/);
  if(salt == null){ const na = pick(/sodyum\D{0,14}?(\d+(?:\.\d+)?)\s*mg/); if(na != null) salt = +(na*2.5/1000).toFixed(2); }
  const add = new Set();
  for(const m of ing.matchAll(/\be\s?-?\s?(\d{3,4}[a-z]{0,2})\b/g)){ const k = ADDU["E"+m[1].toUpperCase()]; if(k) add.add(k); }
  for(const x of namesList()){ if(x.re.test(ing)) add.add(x.k); }
  return {sugar, satFat, salt, add:[...add], hasIng:i >= 0};
}
function scoreOf(p){
  const pen = (v,max,w) => Math.min((v||0)/max,1)*w;
  const c = (p.add||[]).filter(a => info(a).r === "caution").length;
  return Math.max(0, Math.round(100 - pen(p.sugar,22.5,20) - pen(p.satFat,5,20) - pen(p.salt,1.5,15) - Math.min(c*5,15)));
}
function finish(r){
  if(r.sugar == null && r.satFat == null && r.salt == null && !r.add.length){ setMsg("Değer bulunamadı, tekrar deneyin"); return; }
  stopCam();
  const hm = new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
  const p = {name:"Taranan ürün "+hm, brand:"Etiketten okundu", qty:"100 g", sugar:r.sugar ?? 0, satFat:r.satFat ?? 0, salt:r.salt ?? 0, add:r.add, ocr:true};
  p.score = scoreOf(p); S.cur = p; addHist(p); go("sonuc");
  if([r.sugar,r.satFat,r.salt].includes(null)) toast("Bazı değerler okunamadı, Düzenle ile girin");
}
const CAM = {stream:null, worker:null, timer:0, prev:"", gen:0};
const setMsg = t => { const e = $("cmsg"); if(e) e.textContent = t; };
function loadTess(){
  return window.Tesseract ? Promise.resolve() : new Promise((ok,no) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; s.onload = ok; s.onerror = () => no(new Error("lib")); document.head.appendChild(s); });
}
async function ensureWorker(){
  if(CAM.worker) return CAM.worker;
  setMsg("Okuyucu hazırlanıyor…");
  await loadTess();
  CAM.worker = await Tesseract.createWorker("tur");
  return CAM.worker;
}
async function startCam(){
  if(CAM.stream) return;
  const mode = S.screen, gen = ++CAM.gen;
  try{
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw {name:"Insecure"};
    const st = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1920}}, audio:false});
    const v = $("vid");
    if(gen !== CAM.gen || !v){ st.getTracks().forEach(t => t.stop()); return; }
    CAM.stream = st; v.srcObject = st; await v.play();
    const tr = st.getVideoTracks()[0], cp = tr.getCapabilities ? tr.getCapabilities() : {}, adv = [];
    if(cp.focusMode && cp.focusMode.includes("continuous")) adv.push({focusMode:"continuous"});
    if(mode === "ocr" && cp.zoom) adv.push({zoom:Math.min(2, cp.zoom.max)});
    if(adv.length) tr.applyConstraints({advanced:adv}).catch(() => {});
    if(mode === "ocr"){ await ensureWorker(); if(gen !== CAM.gen) return; setMsg("Etiketi çerçeveye getirin"); }
    CAM.prev = ""; scanLoop(gen);
  }catch(e){
    stopCam();
    const n = e && e.name;
    setMsg(n === "Insecure" ? "Kamera için sayfa HTTPS ile açılmalı. Dosya olarak açılırsa çalışmaz." : n === "NotAllowedError" ? "Kamera izni verilmedi. Safari ayarlarından bu siteye kamera iznini açıp sayfayı yenileyin." : "Kamera açılamadı: " + (n || "hata"));
  }
}
const loadZx = () => window.ZXing ? Promise.resolve() : new Promise((ok,no) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"; s.onload = ok; s.onerror = () => no(new Error("lib")); document.head.appendChild(s); });
let BD = null, ZR = null;
async function barcodeFrom(v){
  if(window.BarcodeDetector && BD !== false){
    try{ BD = BD || new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]}); const r = await BD.detect(v); return r[0] ? r[0].rawValue : null; }
    catch(e){ BD = false; }
  }
  await loadZx();
  if(!ZR){
    ZR = new ZXing.MultiFormatReader(); const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true); ZR.setHints(hints);
  }
  const c = CAM.cv || (CAM.cv = document.createElement("canvas")), k = Math.min(1, 1280 / v.videoWidth);
  c.width = v.videoWidth*k; c.height = v.videoHeight*k; c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  try{ return ZR.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))).getText(); }
  catch(e){ return null; }
}
async function scanLoop(gen){
  if(gen !== CAM.gen || !CAM.stream) return;
  const v = $("vid");
  try{
    if(v && v.videoWidth){
      if(S.screen === "tara"){
        const code = await barcodeFrom(v);
        if(gen !== CAM.gen) return;
        if(code){ if(navigator.vibrate) navigator.vibrate(60); stopCam(); return scan(code); }
      }else{
        const w = v.videoWidth*0.8, h = v.videoHeight*0.6, c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(v, (v.videoWidth-w)/2, (v.videoHeight-h)/2, w, h, 0, 0, w, h);
        const {data} = await CAM.worker.recognize(c);
        if(gen !== CAM.gen) return;
        const r = parseLabel(data.text);
        const found = [r.sugar,r.satFat,r.salt].filter(x => x != null).length;
        const sig = JSON.stringify([r.sugar,r.satFat,r.salt,r.add]);
        setMsg(found || r.add.length ? `Okunan: ${found} değer, ${r.add.length} katkı` : "Etiketi çerçeveye getirin");
        if((found >= 2 || (r.hasIng && r.add.length)) && sig === CAM.prev) return finish(r);
        CAM.prev = (found >= 2 || r.add.length) ? sig : "";
      }
    }
  }catch(e){
    if(e && e.message === "lib"){ setMsg("Okuyucu kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edin."); return; }
  }
  CAM.timer = setTimeout(() => scanLoop(gen), S.screen === "tara" ? 250 : 400);
}
function stopCam(){ CAM.gen++; clearTimeout(CAM.timer); if(CAM.stream){ CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; } }
async function photoOcr(f){
  if(!f) return;
  try{ setMsg("Okunuyor…"); const w = await ensureWorker(); const {data} = await w.recognize(f); finish(parseLabel(data.text)); }
  catch(e){ setMsg("Okunamadı. İnternet bağlantısını kontrol edin."); }
}
function editP(){ if(!S.cur || !S.cur.ocr){ toast("Veritabanı ürünleri düzenlenemez"); return; } go("duzenle"); }
function duzenle(){
  const p = S.cur, f = (id,l,v) => `<label class="muted" style="font-weight:600">${l} (g)<input id="${id}" inputmode="decimal" value="${num(v)}" style="display:block;margin-top:6px;width:100%;min-height:48px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:0 14px;font:15px Inter"></label>`;
  return `<div class="pad"><h2>Değerleri düzenle</h2><div class="muted">100 g başına değerleri kontrol edin.</div>${f("e1","Şeker",p.sugar)}${f("e2","Doymuş yağ",p.satFat)}${f("e3","Tuz",p.salt)}<div class="pair"><button class="btn" onclick="go('sonuc')">Vazgeç</button><button class="btn p" onclick="saveP()">Kaydet</button></div></div>`;
}
function saveP(){
  const g = id => { const x = parseFloat($(id).value.replace(",",".")); return isNaN(x) ? 0 : x; };
  const p = S.cur; p.sugar = g("e1"); p.satFat = g("e2"); p.salt = g("e3"); p.score = scoreOf(p); go("sonuc");
}
function ocrView(){
  return `<div class="cam" style="height:440px"><video id="vid" playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video><div class="frame" style="position:relative;width:300px;height:280px;border-radius:12px"></div>
    <div id="cmsg" style="position:absolute;bottom:14px;left:0;right:0;font-size:15px;color:#E8F3EC;text-align:center;padding:0 20px;text-shadow:0 1px 3px #000">Besin tablosunu veya içindekileri çerçeveye alın</div></div>
  <div class="pad">
    <div class="muted">Okuma cihazda yapılır. İlk açılışta dil dosyası indirilir.</div>
    <button class="btn p" onclick="startCam()">Kamerayı yeniden aç</button>
    <label class="btn" style="display:flex;align-items:center;justify-content:center;cursor:pointer">Fotoğraf seç<input type="file" accept="image/*" capture="environment" hidden onchange="photoOcr(this.files[0])"></label>
    <button class="btn" onclick="go('bulunamadi')">Geri</button>
  </div>`;
}
const VIEWS = {tara, sonuc, bulunamadi, ocr: ocrView, gecmis, katkilar, katki, duzenle, ayarlar};
const TABS = [["tara","Tara"],["gecmis","Geçmiş"],["katkilar","Katkılar"],["ayarlar","Ayarlar"]];
const ACTIVE = {tara:"tara", sonuc:"tara", bulunamadi:"tara", ocr:"tara", gecmis:"gecmis", katkilar:"katkilar", katki:"katkilar", ayarlar:"ayarlar", duzenle:"tara"};

function render(){
  $("app").innerHTML = (VIEWS[S.screen] || tara)();
  if(S.screen === "katkilar") fillList();
  if(S.screen === "tara" || S.screen === "ocr") startCam();
  const active = S.screen === "katki" ? (ACTIVE[S.back] || "katkilar") : ACTIVE[S.screen];
  $("tabs").innerHTML = TABS.map(([k,l]) => `<button class="tab ${active===k?'on':''}" onclick="go('${k}')">${l}</button>`).join("");
  $("phone").setAttribute("data-theme", S.dark ? "dark" : "light");
}
function go(s){ stopCam(); S.screen = s; render(); $("app").scrollTop = 0; }
function scan(code){
  const p = DB[code];
  if(p){ S.cur = p; addHist(p); go("sonuc"); }
  else { S.cur = null; go("bulunamadi"); }
}
function openHist(i){ S.cur = S.hist[i]; go("sonuc"); }
function toggleDark(){ S.dark = !S.dark; render(); }
function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 1600);
}
render();
</script>
</body>
